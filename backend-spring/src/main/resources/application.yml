server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  datasource:
    url: jdbc:sqlite:${DATABASE_FILE:./data/bemfh.sqlite}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
app:
  seed-demo-content: ${SEED_DEMO_CONTENT:false}
  jwt-secret: ${JWT_SECRET:development-only-change-this-secret}
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  superadmin-email: ${SUPERADMIN_EMAIL:}
  superadmin-password: ${SUPERADMIN_PASSWORD:}
