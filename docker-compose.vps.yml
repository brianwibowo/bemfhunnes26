services:
  api:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend-spring/.env
    environment:
      PORT: 8080
      DATABASE_FILE: /app/data/bemfh.sqlite
      UPLOAD_DIR: /app/uploads
    volumes:
      - bemfh_data:/app/data
      - bemfh_uploads:/app/uploads
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  bemfh_data:
  bemfh_uploads:
  caddy_data:
  caddy_config:
