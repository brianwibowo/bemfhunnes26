<app-page-intro eyebrow="Kabar terbaru" title="Cerita, gagasan, dan gerak." description="Ikuti kabar dari BEM FH UNNES: program yang sedang berjalan, perspektif kajian, serta peluang yang bisa kamu manfaatkan."></app-page-intro><section class="section container" appScrollReveal><ng-container *ngIf="articles$ | async as result"><div class="news-toolbar"><div class="filters"><button *ngFor="let category of categories" class="pill" [class.active]="selectedCategory() === category" [attr.aria-pressed]="selectedCategory() === category" type="button" (click)="selectCategory(category)">{{category}}</button></div><span class="muted">{{visibleCount(result.data)}} artikel</span></div><div class="grid grid-3"><ng-container *ngFor="let article of result.data"><app-news-card *ngIf="matchesCategory(toNews(article))" [item]="toNews(article)" /></ng-container></div><app-pagination [meta]="result.pagination" (pageChange)="loadPage($event)" /></ng-container></section>
